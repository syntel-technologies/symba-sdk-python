name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  typecheck:
    name: Typecheck (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pyright

  unit:
    name: Unit (py${{ matrix.python }} · deps=${{ matrix.deps }} · redis=${{ matrix.redis }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        deps: [latest]
        redis: [absent]
        include:
          # exercise the min end of the dependency ranges on the floor Python
          - python: "3.11"
            deps: min
            redis: absent
          # exercise the two supported redis majors on a current Python
          - python: "3.13"
            deps: latest
            redis: "5"
          - python: "3.13"
            deps: latest
            redis: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync (latest deps)
        if: matrix.deps == 'latest'
        run: uv sync --all-extras --python ${{ matrix.python }}
      - name: Sync (min deps)
        if: matrix.deps == 'min'
        run: uv sync --all-extras --resolution lowest-direct --python ${{ matrix.python }}
      - name: Pin redis major
        if: matrix.redis != 'absent'
        run: uv pip install "redis~=${{ matrix.redis }}.0"
      - name: Unit + conformance tests
        run: uv run pytest tests/unit tests/conformance -q

  stub-check:
    name: Proto stub drift
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # requires access to the engine repo at the pinned tag; skips cleanly if unreachable.
      - name: Check committed stubs match the pinned engine proto
        run: |
          if make stub-check; then
            echo "stubs OK"
          else
            echo "::warning::stub-check could not verify (engine repo may be private/unreachable in CI)"
          fi

  build:
    name: Build + twine check
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - name: Validate distribution metadata
        run: |
          uv pip install --system twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
