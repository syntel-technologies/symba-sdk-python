version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      compatible-python:
        update-types: [minor, patch]
